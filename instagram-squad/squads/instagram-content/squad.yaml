code: instagram-content
name: "Conteúdo Instagram — César Couto Arquitetura"
description: >
  Pesquisa pautas e ângulos sobre construção via financiamento imobiliário e
  arquitetura residencial, produz conteúdo educativo para Feed, Reels e Stories,
  gera os slides visuais do carrossel e revisa tudo antes da aprovação final.
  Pausa em checkpoints para o usuário decidir: foco da pesquisa, ângulo escolhido,
  aprovação do conteúdo e aprovação final.
icon: "📱"

